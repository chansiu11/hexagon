name: HYPER HEXAGON 4-2 connected original-film gameplay
on:
  push:
    branches:
      - rebuild-step-4-1-hyper-hexagon-20261116
  workflow_dispatch:
jobs:
  hyper-4-2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax, data-backed pre-60/post-60 parts, reachability and collision tests
        run: |
          node --check hyper-hexagon-parts.js
          node --check play.js
          node --check stages/hyper-hexagon.js
          node --check test/hyper-hexagon-4-2.test.cjs
          node --test test/hyper-hexagon-4-1.test.cjs test/hyper-hexagon-4-2.test.cjs
          node --test test/rebuilt-engine.test.cjs test/hexagonest-opening.test.cjs \
            test/hexagon-parts.test.cjs test/hexagoner-parts.test.cjs \
            test/hexagonest-real-films.test.cjs
      - name: Install Chromium for genuine UI play tests
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Start HTTP server
        run: |
          node server.cjs >/tmp/hexagon-hyper-4-2.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run stage4 both-video random seams in browser
        run: node test/hyper-hexagon-4-2-browser.test.cjs
      - name: Run original chronological stage4 and prior 1-3 regression
        run: |
          node test/hyper-hexagon-4-1-browser.test.cjs
          node test/hyper-hexagon-4-1-prior-stage3-browser.test.cjs
          node test/video-browser.test.cjs
          node test/hexagoner-browser.test.cjs
          node test/hexagon-parts-browser.test.cjs
          node test/hexagoner-parts-browser.test.cjs
      - name: Save play screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyper-hexagon-4-2-playback-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
