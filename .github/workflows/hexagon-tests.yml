name: Rebuilt Hexagon 1-1 checks
on:
  push:
    branches: [main, rebuild-hexagon-1-1-20261116]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static scripts and unit tests
        run: |
          node --check engine.js
          node --check play.js
          node --check menu-ui.js
          node --check audio.js
          node --test engine.test.cjs
