name: HEXAGON / HEXAGONER rebuilt source verification
on:
  push:
    branches: [main, rebuild-step-*]
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check engine.js
          node --check replay.js
          node --check parts.js
          node --check audio.js
          node --check play.js
          node --check menu.js
          node --check stages/hexagon.js
          node --check stages/hexagoner.js
          node --check test/hexagoner-source.test.cjs
          node --check test/hexagoner-browser.test.cjs
          node --check test/rebuilt-engine.test.cjs
          node --check test/rebuilt-browser.test.cjs
          node --check test/video-replay.test.cjs
          node --check test/video-browser.test.cjs
          node --check test/hexagon-parts.test.cjs
          node --check test/hexagon-parts-browser.test.cjs
      - name: New engine and map continuity tests
        run: node --test test/rebuilt-engine.test.cjs test/video-replay.test.cjs test/hexagon-parts.test.cjs test/hexagoner-source.test.cjs
      - name: Install Chromium browser test tools
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          node server.cjs >/tmp/hexagon-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify title/select and new play/death flows in Chromium
        run: |
          node test/rebuilt-browser.test.cjs
          node test/video-browser.test.cjs
          node test/hexagon-parts-browser.test.cjs
          node test/hexagoner-browser.test.cjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filmed-hexagon-hexagoner-source-validation-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
