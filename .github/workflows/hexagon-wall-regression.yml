name: Hexagon wall continuity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  wall-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify free rotation and one-sector-per-keypress modes
        run: |
          node control-modes.test.cjs
          node direct-controls.test.cjs
          node music-motion.test.cjs
          node song-difficulty.test.cjs
          node audio-start.test.cjs
          node mixed-transition.test.cjs
          node surprise-morph.test.cjs
          node cell-wall-death.test.cjs
      - name: Verify the random seventh level has fair playable wall sequences
        run: node random-level.test.cjs
      - name: Audit 0-60 second wall actors and camera for all six stages
        run: node camera-wall-continuity.test.cjs
      - name: Audit polygon morph and escape passages
        run: node wall-morph-stability.test.cjs
      - name: Audit individual canvas fills on each simulated frame
        run: node wall-renderer.test.cjs
      - name: Preserve first eighteen seconds and first five-sided transition
        run: node first-pentagon-reference.test.cjs
      - name: Ensure the first pentagon corridor stays reachable at player movement speed
        run: node first-pentagon-playable.test.cjs
      - name: Verify wider playable corridor at 24 seconds
        run: node pentagon-24s-passage.test.cjs
      - name: Verify open square gap at 32 seconds and reachable player path
        run: node square-32s-passage.test.cjs
      - name: Verify one simple dodge in the start of stage five
        run: node stage-five-bonus-early.test.cjs
      - name: Ensure late stage-five wall passages remain reachable at real turning speed
        run: node stage-five-30s-reachable.test.cjs
      - name: Verify only two staggered side walls are removed around 30 seconds of stage five
        run: node stage-five-30s-remove-side-pair.test.cjs
      - name: Compare video-measured wall radii and morph timing across six stages
        run: node reference-wall-timing.test.cjs
      - name: Ensure all six maps use only the selected original gameplay video
        run: node single-video-wall-source.test.cjs
      - name: Build 0-60s time-matched source-video-trace geometry comparisons
        run: node source-geometry-compare.cjs
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium for screenshot verification
        run: npx playwright install --with-deps chromium
      - name: Start local browser test server
        run: |
          node server.cjs >/tmp/hexagon-web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Validate rendered wall pixels on every map
        run: node browser-wall-visual.test.cjs
      - name: Verify control-mode UI, hotkeys and separate records in Chromium
        run: node browser-control-modes.test.cjs
      - name: Verify random-level navigation, replay variety and records in Chromium
        run: node browser-random-level.test.cjs
      - name: Verify rebuilt HARD gameplay and death flow in Chromium
        run: node browser-hard-mode.test.cjs
      - name: Verify audible original voice cues and HARD wall/death feedback
        run: node browser-hard-feedback.test.cjs
      - name: Verify calibrated HARD motion and low-frame-rate timing
        run: node browser-hard-motion.test.cjs
      - name: Verify death impact visibility in Chromium
        run: node browser-death.test.cjs
      - name: Verify 317-second Hexagonest canvas and three controls
        run: node browser-hexagonest.test.cjs
      - name: Verify Hexagonest collision death camera, result and decoded voice cues
        run: node browser-hexagonest-feedback.test.cjs
      - name: Wait for updated GitHub Pages content
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://chansiu11.github.io/hexagon/ |
              grep -q 'play.js?v=projective-depth-v1'; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Check the deployed GitHub Pages canvas
        if: github.event_name == 'push'
        run: |
          node browser-wall-visual.test.cjs
          node browser-hexagonest.test.cjs
          node browser-hexagonest-feedback.test.cjs
        env:
          HEXAGON_URL: https://chansiu11.github.io/hexagon/
      - name: Archive browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hexagon-wall-screenshots
          path: |
            wall-browser-screenshots/
            wall-source-comparisons/
          if-no-files-found: ignore
