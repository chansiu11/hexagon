name: Produce cleaned gameplay announcement clips

on:
  push:
    branches: [voice-bgm-cleanup-all-stages-20261108]
    paths:
      - scripts/clean-voice.py
      - .github/workflows/voice-denoise.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-voices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source voice recordings
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install signal-processing requirements
        run: python -m pip install --quiet numpy scipy
      - name: Check FFmpeg and produce 7 improved source clips
        run: |
          ffmpeg -version | head -n 1
          python scripts/clean-voice.py
          test "$(find assets/voice/clean -maxdepth 1 -name '*.mp3' | wc -l)" -eq 7
          ffprobe -v error -show_entries format=duration assets/voice/clean/death.mp3
      - name: Commit newly generated voice-only clips to the feature branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/voice/clean/
          if ! git diff --cached --quiet; then
            git commit -m "Audio: regenerate 7 speech-focused gameplay voice assets"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
