<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>5-1 HYPER HEXAGONER — Source-order preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c0c13;color:#fff;font:14px system-ui,Arial,sans-serif}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:10px}
header,footer{width:min(960px,100%);display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
canvas{display:block;width:min(960px,100%);height:auto;aspect-ratio:8/5;background:#101018;touch-action:none;outline:1px solid #777}
button,a{padding:8px 13px;border:1px solid #888;background:#282936;color:white;border-radius:4px;cursor:pointer}
button[aria-pressed=true]{background:#7948b8;border-color:#ddd}
label{display:flex;align-items:center;gap:4px}input[type=range]{flex:1;min-width:150px}
small{color:#c2c2c2}#status{min-width:230px;text-align:center}a{text-decoration:none}
</style></head><body><main>
<header><strong>5-1 · HYPER HEXAGONER</strong>
<button id="source-a" aria-pressed="true">영상 1 순서</button>
<button id="source-b" aria-pressed="false">영상 2 순서</button>
<button id="toggle">일시정지</button>
<button id="restart">처음부터</button>
<label><input id="spectate" type="checkbox" checked> 관찰 모드 (충돌 무시)</label></header>
<canvas id="game" width="960" height="600" aria-label="HYPER HEXAGONER 벽 순서 검증"></canvas>
<footer><span id="clock">0.00s</span><input id="seek" aria-label="게임 시간 이동" type="range" min="0" max="99" step=".1" value="0">
<span id="status">광학 추출 미리보기 — 원작과 픽셀 단위 일치 아님</span><a href="../index.html">기존 메뉴</a></footer>
<small>방향키 또는 A/D 회전 · Space 정지 · R 다시 시작 · 1/2 영상 선택. 영상은 게임 시작 후 시간을 기준으로 재생합니다.</small>
</main>
<script src="./rebuilt-engine.js"></script>
<script src="./rebuilt-play.js"></script>
<script src="./hyper-hexagoner-order.js"></script>
<script src="./preview.js"></script>
</body></html>
